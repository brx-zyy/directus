name: Release Notes Injection PoC (isolated)

on:
  push:
    branches:
      - security-audit/live-release-notes-poc
    paths:
      - '.changeset/live-release-poc.md'
      - '.github/workflows/security-release-poc.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run actual Changesets release-note generator and write GITHUB_OUTPUT
        id: changeset-version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUTPUT=$(pnpm changeset version 2>&1)
          STATUS=$?
          set -e

          echo "$OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "pnpm changeset version failed: $STATUS"
            exit "$STATUS"
          fi

          RELEASE_NOTES=$(echo "$OUTPUT" | awk -v RS="==============================================================" 'NR==3 {print}' | sed '1{/^$/d}')

          {
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Reproduce the vulnerable release PR heredoc without any secret
        env:
          MARKER_PATH: ${{ runner.temp }}/directus-release-poc
        run: |
          PR_BODY=$(cat <<'EOF'
          ### 🚀 Release Notes
          ${{ steps.changeset-version.outputs.release_notes }}
          EOF
          )

          if [ ! -f "$MARKER_PATH" ]; then
            echo "POC_FAILED: marker file was not created"
            exit 1
          fi

          echo "POC_CONFIRMED: injected shell command executed"
          cat "$MARKER_PATH"
          test "$(cat "$MARKER_PATH")" = "DIRECTUS_LIVE_POC_CONFIRMED"

      - name: Preserve proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directus-release-notes-poc
          path: ${{ runner.temp }}/directus-release-poc
          if-no-files-found: ignore
