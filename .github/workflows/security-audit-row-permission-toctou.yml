name: Security regression - row permission TOCTOU

on:
  workflow_dispatch:
  push:
    branches:
      - security-audit/row-permission-toctou
    paths:
      - tests/e2e/tests/permissions/row-permission-toctou.sb.test.ts
      - .github/workflows/security-audit-row-permission-toctou.yml

permissions:
  contents: read

jobs:
  postgres-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests/e2e exec vitest run --project postgres tests/permissions/row-permission-toctou.sb.test.ts
