name: Security regression - row permission TOCTOU

on:
  workflow_dispatch:
  push:
    branches:
      - security-audit/row-permission-toctou
    paths:
      - tests/e2e/tests/permissions/row-permission-toctou.sb.test.ts
      - .github/workflows/security-audit-row-permission-toctou.yml

permissions:
  contents: read

jobs:
  postgres-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: true
      - run: cd tests/e2e && LOG_LEVEL=debug pnpm vitest run --project postgres-sb --no-file-parallelism tests/permissions/row-permission-toctou.sb.test.ts
