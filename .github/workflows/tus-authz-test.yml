name: TUS Authorization Audit

on:
  push:
    branches:
      - security-audit/tus-authz-test
    paths:
      - "api/src/controllers/tus.ts"
      - "api/src/controllers/tus.test.ts"
      - "api/src/services/tus/**"
      - "tests/e2e/tests/endpoints/files/files.sb.test.ts"
      - "tests/e2e/tests/endpoints/files/tus-custom-auth.sb.test.ts"
      - "tests/e2e/tests/auth/role-revocation.sb.test.ts"
      - "tests/e2e/tests/endpoints/utils/sort-row-permission.sb.test.ts"
      - "tests/e2e/tests/endpoints/utils-sort-permissions.sb.test.ts"
      - "tests/e2e/tests/endpoints/query/sort/snapshot.ts"
      - "api/src/services/utils.ts"
      - "tests/e2e/tests/endpoints/files/hooks/custom-anonymous-auth/**"
      - ".github/workflows/tus-authz-test.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tus-authz-audit
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Focused TUS authorization and datastore tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare monorepo
        uses: ./.github/actions/prepare

      - name: Run TUS controller, datastore, and completion tests
        run: >
          pnpm --filter @directus/api exec vitest run
          src/controllers/tus.test.ts
          src/services/tus/data-store.test.ts
          src/services/tus/server.test.ts
        working-directory: api

      - name: Run two-user TUS HTTP integration test
        run: >
          pnpm --filter e2e exec vitest run --project sqlite-sb
          tests/endpoints/files/files.sb.test.ts
        working-directory: tests/e2e

      - name: Run role downgrade session test
        run: >
          pnpm --filter e2e exec vitest run --project sqlite-sb
          tests/auth/role-revocation.sb.test.ts
        working-directory: tests/e2e

      - name: Run row-level sort authorization test
        run: >
          pnpm --filter e2e exec vitest run --project sqlite-sb
          tests/endpoints/utils/sort-row-permission.sb.test.ts
        working-directory: tests/e2e

      - name: Run sort row-level authorization integration test
        run: >
          pnpm --filter e2e exec vitest run --project sqlite-sb
          tests/endpoints/utils-sort-permissions.sb.test.ts
        working-directory: tests/e2e
      - name: Run custom-auth anonymous TUS integration test
        run: >
          pnpm --filter e2e exec vitest run --project sqlite-sb
          tests/endpoints/files/tus-custom-auth.sb.test.ts
        working-directory: tests/e2e
